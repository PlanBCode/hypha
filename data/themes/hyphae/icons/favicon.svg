<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Hyphae mark: a hub with branching threads, as a fungal network grows. Colours of the theme palette. -->
	<style>
		.bg { fill: #0B7285; }
		.thread { fill: none; stroke: #ffffff; stroke-width: 40; stroke-linecap: round; stroke-linejoin: round; }
		.node { fill: #ffffff; }
		.hub { fill: #fe9900; stroke: #ffffff; stroke-width: 16; }
		@media (prefers-color-scheme: dark) {
			.bg { fill: #1d2021; }
			.thread { stroke: #6EC1CF; }
			.node { fill: #6EC1CF; }
			.hub { stroke: #1d2021; }
		}
	</style>
	<rect class="bg" width="512" height="512" rx="120"/>
	<path class="thread" d="M256 404C248 350 264 306 256 262M256 262C222 226 192 210 150 204M256 262C292 220 326 196 368 182M206 213C200 176 210 144 232 118"/>
	<circle class="node" cx="150" cy="204" r="34"/>
	<circle class="node" cx="368" cy="182" r="34"/>
	<circle class="node" cx="232" cy="118" r="30"/>
	<circle class="node" cx="256" cy="404" r="34"/>
	<circle class="hub" cx="256" cy="262" r="50"/>
</svg>
